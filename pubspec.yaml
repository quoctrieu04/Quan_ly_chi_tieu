name: chitieu
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  provider: ^6.0.5
  shared_preferences: ^2.2.2
  fl_chart: ^0.66.0
  speech_to_text: ^7.3.0
  diacritic: ^0.1.6  
